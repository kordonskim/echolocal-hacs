assign_tone:
  fields:
    tone:
      required: true
      example: doorbell_chime
      selector:
        text:
    device_id:
      required: true
      selector:
        device:
          multiple: true
          filter:
            - integration: esphome
              manufacturer: EchoLocal
unassign_tone:
  fields:
    tone:
      required: true
      example: doorbell_chime
      selector:
        text:
    device_id:
      required: true
      selector:
        device:
          multiple: true
          filter:
            - integration: esphome
              manufacturer: EchoLocal
ping:
  fields:
    protocol:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 1000
          mode: box
camera_webrtc:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    offer:
      required: true
      selector:
        text:
          multiline: true
camera_webrtc_close:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    session:
      required: true
      selector:
        text:
call_answer:
  fields:
    session:
      required: true
      selector:
        text:
    sdp:
      required: true
      selector:
        text:
          multiline: true
call_end:
  fields:
    session:
      required: true
      selector:
        text:
    reason:
      selector:
        text:
